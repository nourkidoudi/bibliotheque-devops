apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: library
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels: {app: mongodb}
  template:
    metadata:
      labels: {app: mongodb}
    spec:
      containers:
        - name: mongo
          image: mongo:7-jammy
          ports: [{containerPort: 27017}]
          env:
            - {name: MONGO_INITDB_ROOT_USERNAME, value: mongo}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: library-secrets, key: MONGO_INITDB_ROOT_PASSWORD}}
          readinessProbe:
            exec: {command: ["mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          volumeMounts:
            - {name: data, mountPath: /data/db}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: library
spec:
  clusterIP: None
  selector: {app: mongodb}
  ports: [{port: 27017}]
