apiVersion: apps/v1
kind: Deployment
metadata:
  name: books-service
  namespace: library
spec:
  replicas: 1
  selector:
    matchLabels: {app: books-service}
  template:
    metadata:
      labels: {app: books-service}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3002"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1001
      containers:
        - name: books-service
          image: REGISTRY/books-service:TAG   # remplacé par la CI / ArgoCD (ex. nourkidoudi/books-service:<sha>)
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3002}]
          envFrom:
            - configMapRef: {name: library-config}
          env:
            - {name: PORT, value: "3002"}
            - {name: DB_HOST, value: "postgres-books"}
            - {name: DB_PORT, value: "5432"}
            - {name: DB_NAME, value: "library_books"}
            - {name: DB_USER, value: "postgres"}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: library-secrets, key: POSTGRES_PASSWORD}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: library-secrets, key: JWT_SECRET}}
            - name: SERVICE_API_KEY
              valueFrom: {secretKeyRef: {name: library-secrets, key: SERVICE_API_KEY}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /health, port: 3002}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 3002}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          volumeMounts:
            - {name: uploads, mountPath: /app/uploads}
      volumes:
        - name: uploads
          persistentVolumeClaim: {claimName: books-uploads}
      # ⚠️ replicas=1 car PVC local-path = ReadWriteOnce. Pour scaler : MinIO/S3 (voir docs/AMELIORATIONS.md §4)
---
apiVersion: v1
kind: Service
metadata:
  name: books-service
  namespace: library
spec:
  selector: {app: books-service}
  ports: [{port: 3002, targetPort: 3002}]
