# ⚠️ MODÈLE : ne JAMAIS committer les vraies valeurs.
# Créer le vrai secret en ligne de commande :
#   kubectl -n library create secret generic library-secrets \
#     --from-literal=JWT_SECRET=$(openssl rand -hex 32) \
#     --from-literal=SERVICE_API_KEY=$(openssl rand -hex 32) \
#     --from-literal=POSTGRES_PASSWORD=$(openssl rand -hex 16) \
#     --from-literal=MONGO_INITDB_ROOT_PASSWORD=$(openssl rand -hex 16)
# Pour GitOps (ArgoCD) : chiffrer avec Sealed Secrets (kubeseal) et committer le SealedSecret.
apiVersion: v1
kind: Secret
metadata:
  name: library-secrets
  namespace: library
type: Opaque
stringData:
  JWT_SECRET: CHANGE_ME
  SERVICE_API_KEY: CHANGE_ME
  POSTGRES_PASSWORD: CHANGE_ME
  MONGO_INITDB_ROOT_PASSWORD: CHANGE_ME
