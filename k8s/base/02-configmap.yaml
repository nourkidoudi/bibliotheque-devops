apiVersion: v1
kind: ConfigMap
metadata:
  name: library-config
  namespace: library
data:
  NODE_ENV: production
  JWT_EXPIRATION: 1h
  JWT_REFRESH_EXPIRATION: 7d
  BOOKS_SERVICE_URL: http://books-service:3002
  CORS_ORIGINS: http://library.local
  COOKIE_SECURE: "false"   # passer à "true" une fois l'Ingress en HTTPS
