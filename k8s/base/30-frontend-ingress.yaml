apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: library
spec:
  replicas: 2
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: REGISTRY/frontend:TAG
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: library
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: library
  namespace: library
spec:
  ingressClassName: traefik          # Ingress controller par défaut de K3s
  rules:
    - host: library.local            # ajouter "<IP-du-noeud> library.local" dans /etc/hosts
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: frontend, port: {number: 80}}
