server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Static uploads from books-service
    location /uploads/ {
        proxy_pass http://books-service:3002/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API Gateway routing to Microservices
    location /api/auth/ {
        proxy_pass http://users-service:3001/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/users/ {
        proxy_pass http://users-service:3001/api/users/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /api/users {
        proxy_pass http://users-service:3001/api/users/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /api/books {
        proxy_pass http://books-service:3002/api/books/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/books/ {
        proxy_pass http://books-service:3002/api/books/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /api/categories {
        proxy_pass http://books-service:3002/api/categories/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/categories/ {
        proxy_pass http://books-service:3002/api/categories/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/loans/ {
        proxy_pass http://loans-service:3003/api/loans/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /api/loans {
        proxy_pass http://loans-service:3003/api/loans/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /api/notifications {
        proxy_pass http://loans-service:3003/api/notifications/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/notifications/ {
        proxy_pass http://loans-service:3003/api/notifications/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /api/stats {
        proxy_pass http://loans-service:3003/api/stats/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/stats/ {
        proxy_pass http://loans-service:3003/api/stats/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA routing - fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
