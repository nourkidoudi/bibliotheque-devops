server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API : utilisé avec docker-compose (sous Kubernetes, l'Ingress route /api/* directement)
  location /api/users/ { proxy_pass http://users-service:3001; }
  location /api/books  { proxy_pass http://books-service:3002; }
  location /api/loans  { proxy_pass http://loans-service:3003; }

  location / { try_files $uri /index.html; }
  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
}
