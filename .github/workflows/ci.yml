name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [users-service, books-service, loans-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package.json
      - run: npm install --no-audit --no-fund
      - run: npm test            # étape obligatoire : bloque le pipeline si un test échoue

  build-scan:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [users-service, books-service, loans-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t library/${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: library/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      # Étape suivante (CD) : docker push + mise à jour du tag dans k8s/ => ArgoCD synchronise
